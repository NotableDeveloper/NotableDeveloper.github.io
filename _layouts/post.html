---
layout: default
---
<article class="post-content">
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>{% if page.categories %} · {{ page.categories | join: " / " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="post-lede">{{ page.description }}</p>{% endif %}
  <div class="post-body">{{ content }}</div>
</article>
