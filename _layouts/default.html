<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title == 'Home' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    {% seo %}
    {% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">/</span>{{ site.title }}</a>
        <nav aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}">Posts</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>
    <main class="shell">{{ content }}</main>
    <footer class="site-footer shell">
      <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}. Built with Jekyll.</p>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </footer>
  </body>
</html>
